name: AP04 - Agente Crafter multi-compito preaddestrato

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica-agente:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WANDB_MODE: disabled
      WANDB_SILENT: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Preleva AP04-Crafter
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepara Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Preleva il codice sorgente dell'agente pubblicato
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v1.0.0 https://github.com/v-ade-r/Rainbow_IQN_Crafter.git agente_rainbow
          mkdir -p risultati_pretrained
          git -C agente_rainbow rev-parse HEAD | tee risultati_pretrained/commit_agente.txt
          python --version | tee risultati_pretrained/python_versione.txt

      - name: Installa dipendenze su CPU
        shell: bash
        working-directory: agente_rainbow
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Si evita di installare CUDA su un runner privo di GPU.
          python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Scarica il checkpoint finale rilasciato dall'autore
        shell: bash
        working-directory: agente_rainbow
        run: |
          set -euo pipefail
          mkdir -p checkpoints
          curl --fail --location --show-error --silent --retry 3 \
            'https://github.com/v-ade-r/Rainbow_IQN_Crafter/releases/download/v1.0.0/rainbow_iqn_agent_final.pt' \
            --output checkpoints/agent_final.pt
          test "$(stat -c%s checkpoints/agent_final.pt)" -gt 10000000
          sha256sum checkpoints/agent_final.pt | tee ../risultati_pretrained/sha256_checkpoint.txt
          stat -c '%n %s bytes' checkpoints/agent_final.pt | tee ../risultati_pretrained/dimensione_checkpoint.txt

      - name: Esegui valutazione preliminare di 8 episodi su CPU
        shell: bash
        working-directory: agente_rainbow
        run: |
          set -euo pipefail
          # Non e' un test di H3 e non misura la velocita' di apprendimento.
          # Il checkpoint .pt esterno viene caricato soltanto nel runner GitHub.
          python scripts/evaluate.py checkpoints/agent_final.pt --episodes 8 --device cpu \
            2>&1 | tee ../risultati_pretrained/eval_8_episodi.log

      - name: Archivia tracciati, identificativi ed errori
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AP04_agente_Rainbow_preaddestrato
          if-no-files-found: warn
          path: |
            risultati_pretrained/
